# pnpm 10+ aborta el install si nadie decidio que hacer con los scripts de
# instalacion de las dependencias. Ninguno de estos dos hace falta:
# @parcel/watcher solo acelera el modo --watch de Jest, y unrs-resolver es el
# binario nativo opcional del resolutor de imports de ESLint.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# pnpm rechaza por defecto una version publicada hace muy poco: es la defensa
# contra un mantenedor comprometido que publica algo malicioso y lo ve instalado
# al instante. La politica cuida de terceros, y estos paquetes son propios - los
# publica el mismo equipo desde un workflow que corre la suite antes de subir.
#
# La exclusion es por scope y no por version para que un parche del framework
# se pueda probar el mismo dia en que se publica.
minimumReleaseAgeExclude:
  - '@ahincho/nova-*'

# Lo que queda del catalogo es solo herramienta de desarrollo. Las versiones
# de runtime -NestJS, class-validator, rxjs, reflect-metadata, terminus- ya no
# se declaran aca: llegan dentro de @ahincho/nova-nestjs, que es el unico
# paquete de `dependencies`.
catalog:
  '@nestjs/cli': ^11.0.10
  '@nestjs/schematics': ^11.0.9
  '@nestjs/testing': ^11.2.1

# Sigue haciendo falta aunque el runtime ya no se declare: @nestjs/testing y
# ts-jest si tienen peers, y esto es lo que atrapa a un servicio que declare
# @nestjs/testing 12 mientras la plataforma trae NestJS 11.
strictPeerDependencies: true

# NestJS llega dentro de @ahincho/nova-nestjs, y pnpm aisla node_modules: un
# paquete que entra por transitividad no se puede importar. Sin esto, el
# `import { Module } from '@nestjs/common'` de cualquier modulo corta con
# TS2307. Es la contrapartida de que el servicio no elija la version.
publicHoistPattern:
  - '@nestjs/*'
  - rxjs
  - reflect-metadata
  - class-validator
  - class-transformer
