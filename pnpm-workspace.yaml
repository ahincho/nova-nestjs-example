# pnpm rechaza por defecto una version publicada hace muy poco: es la defensa
# contra un mantenedor comprometido que publica algo malicioso y lo ve instalado
# al instante. La politica cuida de terceros, y estos paquetes son propios - los
# publica el mismo equipo desde un workflow que corre la suite antes de subir.
#
# La exclusion es por scope y no por version para que un parche del framework
# se pueda probar el mismo dia en que se publica.
minimumReleaseAgeExclude:
  - '@ahincho/nova-*'

# Ya no queda ninguna version declarada en este repositorio, pero los paquetes
# que llegan por transitividad si tienen peers entre ellos -@nestjs/testing con
# @nestjs/common, vitest con su proveedor de cobertura- y esto es lo que avisa
# si la plataforma alguna vez publica una combinacion que no cierra.
strictPeerDependencies: true

# pnpm 10+ bloquea los scripts de instalación de las dependencias y aborta el
# install si nadie decidió qué hacer con ellos.
#
# Va en false porque el script de `@scarf/scarf` es telemetría: le reporta al
# mantenedor que alguien instaló el paquete. Llega arrastrado por
# `swagger-ui-dist`, dentro de `@nestjs/swagger`, que la plataforma trae desde
# la 0.12.0. Apagarlo no le quita nada: la documentación se sirve igual.
allowBuilds:
  '@scarf/scarf': false

# Todo lo que este servicio usa llega dentro de los tres paquetes de la
# plataforma, y pnpm aisla node_modules: un paquete transitivo no se puede
# importar. Sin esto el `import { Module } from '@nestjs/common'` corta con
# TS2307.
#
# La lista es solo de lo que se importa o lo que resuelve el tsconfig. Las
# herramientas que unicamente se ejecutan -oxlint, tsgolint, prettier- no estan,
# porque el comando `nova` las resuelve desde el toolchain.
#
# Es la contrapartida de que el servicio no elija ninguna version.
publicHoistPattern:
  - '@nestjs/*'
  - '@types/*'
  - rxjs
  - reflect-metadata
  - class-validator
  - class-transformer
  - typescript
  - vitest
  - supertest
