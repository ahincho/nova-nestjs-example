# pnpm 10+ aborta el install si nadie decidio que hacer con los scripts de
# instalacion de las dependencias. Ninguno de estos dos hace falta:
# @parcel/watcher solo acelera el modo --watch de Jest, y unrs-resolver es el
# binario nativo opcional del resolutor de imports de ESLint.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# pnpm rechaza por defecto una version publicada hace muy poco: es la defensa
# contra un mantenedor comprometido que publica algo malicioso y lo ve instalado
# al instante. La politica cuida de terceros, y estos paquetes son propios - los
# publica el mismo equipo desde un workflow que corre la suite antes de subir.
#
# La exclusion es por scope y no por version para que un parche del framework
# se pueda probar el mismo dia en que se publica.
minimumReleaseAgeExclude:
  - '@ahincho/nova-*'

# Las versiones de NestJS y de lo que la plataforma declara como peer, en un
# solo lugar. Repartidas entre dependencies y devDependencies era donde
# empezaba la deriva: cada servicio elegia su parche y nadie comparaba.
#
# El catalogo es por repositorio -pnpm no tiene un `extends` que lo traiga de
# un paquete publicado-, asi que esto estandariza hacia adentro. Lo que impide
# que dos servicios queden en NestJS distintos es el bloque de abajo.
catalog:
  '@nestjs/cli': ^11.0.10
  '@nestjs/common': ^11.2.1
  '@nestjs/config': ^4.0.4
  '@nestjs/core': ^11.2.1
  '@nestjs/platform-express': ^11.2.1
  '@nestjs/schematics': ^11.0.9
  '@nestjs/terminus': ^12.0.0
  '@nestjs/testing': ^11.2.1
  class-transformer: ^0.5.1
  class-validator: ^0.14.2
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

# El rango de peer de @ahincho/nova-nestjs dice contra que NestJS esta probada
# la plataforma. Con esto, no cumplirlo deja de ser una advertencia al final
# del install y pasa a romperlo: un servicio no puede irse a NestJS 12 mientras
# la plataforma declare 11, ni quedarse atras en silencio.
strictPeerDependencies: true
