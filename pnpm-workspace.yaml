# pnpm 10+ aborta el install si nadie decidio que hacer con los scripts de
# instalacion de las dependencias. Ninguno de estos dos hace falta:
# @parcel/watcher solo acelera el modo --watch de Jest, y unrs-resolver es el
# binario nativo opcional del resolutor de imports de ESLint.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# pnpm rechaza por defecto una version publicada hace muy poco: es la defensa
# contra un mantenedor comprometido que publica algo malicioso y lo ve instalado
# al instante. La politica cuida de terceros, y estos paquetes son propios - los
# publica el mismo equipo desde un workflow que corre la suite antes de subir.
#
# La exclusion es por scope y no por version para que un parche del framework
# se pueda probar el mismo dia en que se publica.
minimumReleaseAgeExclude:
  - '@ahincho/nova-*'

# Ya no queda ninguna version declarada en este repositorio, pero los paquetes
# que llegan por transitividad si tienen peers entre ellos -ts-jest con jest y
# typescript, @nestjs/testing con @nestjs/common- y esto es lo que avisa si la
# plataforma alguna vez publica una combinacion que no cierra.
strictPeerDependencies: true

# Todo lo que este servicio usa llega dentro de los tres paquetes de la
# plataforma, y pnpm aisla node_modules: un paquete transitivo no se puede
# importar ni expone su binario. Sin esto no existen `tsc` ni `jest`, y el
# `import { Module } from '@nestjs/common'` corta con TS2307.
#
# Es la contrapartida de que el servicio no elija ninguna version.
publicHoistPattern:
  - '@nestjs/*'
  - '@types/*'
  - rxjs
  - reflect-metadata
  - class-validator
  - class-transformer
  - typescript
  - jest
  - ts-jest
  - eslint
  - prettier
  - supertest
