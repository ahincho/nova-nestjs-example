name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para leer los paquetes del meta-framework desde GitHub Packages.
  packages: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # El servicio declara `engines: ">=24.15"`, que permite la linea 26. Es el
    # servicio de referencia de la plataforma, asi que esa afirmacion tiene que
    # estar ejercitada y no solo escrita. La 25 queda fuera: es linea impar y
    # `vitest` 5 la excluye (`^22.12 || ^24 || >=26`).
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # registry-url escribe la credencial en el npmrc de usuario. Hace falta
      # ademas de la del .npmrc del proyecto: el chequeo de supply-chain policy
      # de pnpm 11 consulta el registry sin usar la configuracion del proyecto,
      # y sin esto corta con un 401 despues de haber bajado todo.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ahincho'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # GitHub Packages pide token incluso para un paquete publico. El del
          # run alcanza con el permiso packages: read declarado arriba.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --frozen-lockfile no revisa los peers: reusa el lockfile tal cual y da
      # por bueno lo que ya esta resuelto. La barrera de strictPeerDependencies
      # solo salta en un install que resuelve, o sea en la maquina de quien
      # agrega la dependencia. Aca hay que pedirla explicitamente.
      - name: Peers
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      # Las reglas de arquitectura del BFF, las mismas que emite el generador.
      # Sin este paso el archivo existe y no lo mira nadie.
      - name: Lint arch
        run: pnpm lint:arch

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # test y no test:cov, a proposito: este repo declara `thresholds: false`
      # en su vitest.config.mjs porque lo que prueba es la integracion con la
      # plataforma y no cada rama. Un `test:cov` aca imprimiria un reporte que
      # no bloquea nada. Un servicio generado si lleva umbral, y por eso su
      # `verify` corre la variante con cobertura.
      - name: Test
        run: pnpm test

      # El unico lugar donde la imagen se construye contra el registry de
      # verdad. El CI de la plataforma instala tarballs y repone un .npmrc
      # vacio, asi que alli el `--mount=type=secret` esta montado y nunca se
      # usa: el 401 por una credencial mal pasada no lo ve nadie. Aca si, que
      # es como la construye un servicio real.
      #
      # El montaje de cache de BuildKit vive en el runner, y el runner se
      # destruye: sin exportarla, cada build de CI es frio.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # Antes aca se escribia un npmrc a mano con el token ya resuelto. Desde
      # 0.13.0 no hace falta: `nova docker` busca el npmrc donde npm lo busca
      # -NPM_CONFIG_USERCONFIG, que es donde lo dejo setup-node- y resuelve el
      # ${NODE_AUTH_TOKEN} que ese archivo guarda como marcador. Por eso la
      # variable tiene que estar en el entorno de ESTE paso.
      #
      # --load para que la imagen quede en el daemon y el paso siguiente pueda
      # levantarla; sin eso buildx la construye y la descarta.
      - name: Docker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm docker --tag nova-nestjs-example:ci --cache-from type=gha --cache-to type=gha,mode=max --load

      # Que construya no prueba que arranque. Esto si, y de paso ejercita que
      # una sola imagen sirva para los tres ambientes: NODE_ENV es lo que
      # inyecta la task definition.
      - name: Run the image
        run: |
          set -euo pipefail
          id=$(docker run --rm --detach --env NODE_ENV=development --publish 3000:3000 nova-nestjs-example:ci)
          trap 'docker rm --force "$id" > /dev/null' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health/live; then
              echo
              echo "el contenedor responde"
              exit 0
            fi
            sleep 2
          done

          echo "el contenedor no respondio en 60 s"
          docker logs "$id"
          exit 1
