name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para leer los paquetes del meta-framework desde GitHub Packages.
  packages: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # El servicio declara `engines: ">=24.15"`, que permite la linea 26. Es el
    # servicio de referencia de la plataforma, asi que esa afirmacion tiene que
    # estar ejercitada y no solo escrita. La 25 queda fuera: es linea impar y
    # `vitest` 5 la excluye (`^22.12 || ^24 || >=26`).
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # registry-url escribe la credencial en el npmrc de usuario. Hace falta
      # ademas de la del .npmrc del proyecto: el chequeo de supply-chain policy
      # de pnpm 11 consulta el registry sin usar la configuracion del proyecto,
      # y sin esto corta con un 401 despues de haber bajado todo.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ahincho'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # GitHub Packages pide token incluso para un paquete publico. El del
          # run alcanza con el permiso packages: read declarado arriba.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --frozen-lockfile no revisa los peers: reusa el lockfile tal cual y da
      # por bueno lo que ya esta resuelto. La barrera de strictPeerDependencies
      # solo salta en un install que resuelve, o sea en la maquina de quien
      # agrega la dependencia. Aca hay que pedirla explicitamente.
      - name: Peers
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      # Las reglas de arquitectura del BFF, las mismas que emite el generador.
      # Sin este paso el archivo existe y no lo mira nadie.
      - name: Lint arch
        run: pnpm lint:arch

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # El unico lugar donde la imagen se construye contra el registry de
      # verdad. El CI de la plataforma instala tarballs y repone un .npmrc
      # vacio, asi que alli el `--mount=type=secret` esta montado y nunca se
      # usa: el 401 por una credencial mal pasada no lo ve nadie. Aca si, que
      # es como la construye un servicio real.
      #
      # El npmrc que escribe setup-node NO sirve para esto: vive en RUNNER_TEMP
      # y lleva `${NODE_AUTH_TOKEN}` como marcador, que npm expande al leerlo.
      # Montado como secreto llegaria el marcador y el build cortaria con un
      # 401. Se escribe uno con el valor ya resuelto, y viaja montado y no
      # copiado, asi que no queda en ninguna capa de la imagen.
      # El montaje de cache de BuildKit vive en el runner, y el runner se
      # destruye: sin exportarla, cada build de CI es frio.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@ahincho:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN"
          } > "$RUNNER_TEMP/docker.npmrc"
          pnpm docker --secret id=npmrc,src="$RUNNER_TEMP/docker.npmrc"             --cache-from type=gha --cache-to type=gha,mode=max
