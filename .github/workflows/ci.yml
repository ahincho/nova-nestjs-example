name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para leer los paquetes del meta-framework desde GitHub Packages.
  packages: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # registry-url escribe la credencial en el npmrc de usuario. Hace falta
      # ademas de la del .npmrc del proyecto: el chequeo de supply-chain policy
      # de pnpm 11 consulta el registry sin usar la configuracion del proyecto,
      # y sin esto corta con un 401 despues de haber bajado todo.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ahincho'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # GitHub Packages pide token incluso para un paquete publico. El del
          # run alcanza con el permiso packages: read declarado arriba.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --frozen-lockfile no revisa los peers: reusa el lockfile tal cual y da
      # por bueno lo que ya esta resuelto. La barrera de strictPeerDependencies
      # solo salta en un install que resuelve, o sea en la maquina de quien
      # agrega la dependencia. Aca hay que pedirla explicitamente.
      - name: Peers
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: End-to-end
        run: pnpm test:e2e
